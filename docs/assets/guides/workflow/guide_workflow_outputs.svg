<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">ShapeX outputs</title>
  <desc id="description">ShapeX connects image annotations to plate documentation, laser microdissection, liquid dispensing, and spatial data.</desc>

  <style>
    .text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .card { fill: #24292d; stroke-width: 2; }
    .card-heading { fill: #f6f7f8; font-size: 21px; font-weight: 760; letter-spacing: -0.35px; }
    .icon-line { fill: none; stroke: #b6bec4; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .connector { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <defs>
