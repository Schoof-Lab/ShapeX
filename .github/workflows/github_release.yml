name: Make draft release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Git tag to release
        required: true
        default: "v0.1.0"
        type: string
      release_title:
        description: Release title
        required: true
        default: "ShapeX v0.1.0"
        type: string

jobs:
  build:
    permissions:
      contents: write
    uses: qupath/actions/.github/workflows/github-release.yml@main
    with:
      release-target: ${{ inputs.release_tag }}
      release-title: ${{ inputs.release_title }}
      java-version: "25"
      gradle-args: build shadowJar
      build-path: build/libs/QuPath.ShapeX.extension.v*.jar
