name: Run gradle build

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: qupath/actions/.github/workflows/gradle.yml@main
    with:
      java-version: "25"
      gradle-args: build shadowJar
      artifact-path: build/libs/QuPath.ShapeX.extension.v*.jar
